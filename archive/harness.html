<style>
  html, body { margin: 0; padding: 0; background: Canvas; color: CanvasText; color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .harness-bar { background: #1c2026 !important; border-color: #303844 !important; color: #b8c0cc !important; }
    .harness-bar button { background: #252a31 !important; border-color: #3a434f !important; color: #d4dae3 !important; }
  }
  .harness-bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 8px 12px; border-bottom: 1px solid #d8dde4; background: #f6f7f9;
    font-size: 12px; color: #555;
  }
  .harness-bar button { font: inherit; padding: 3px 9px; border: 1px solid #c9ced8; border-radius: 5px; background: #fff; cursor: pointer; }
  .harness-bar button:hover { border-color: #8a282c; color: #8a282c; }
  .markdown-body { padding: 25px; max-width: 980px; margin: 0 auto; }
  .harness-note { color: #777; font-size: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="harness-bar">
  <strong>Integration harness</strong>
  <span class="harness-note">GitHub base + MarkEdit ITS plugin</span>
  <button type="button" id="rerender">Re-render pane</button>
  <button type="button" id="expand-all">Expand all headings</button>
  <button type="button" id="collapse-all">Collapse all headings</button>
  <button type="button" id="expand-lists">Expand all lists</button>
  <button type="button" id="collapse-lists">Collapse all lists</button>
</div>

<template id="sample">
  <h1 id="explore-the-universe">Explore The Universe</h1>
  <p>This is a rendered preview harness with the same GitHub base styles MarkEdit-preview uses. The H3 sections start folded.</p>

  <ul>
    <li><a href="#stories">Stories</a>
      <ul>
        <li>The stories written in this universe</li>
      </ul>
    </li>
    <li><a href="#characters">Characters</a>
      <ul>
        <li>The base version of characters in this universe, with a deliberately long sentence that wraps onto a second line for the rail test.</li>
      </ul>
    </li>
    <li><a href="#universe">Universe</a>
      <ul>
        <li>The basic version of locations in this universe</li>
      </ul>
    </li>
  </ul>

  <hr>

  <h2 id="stories">Stories</h2>
  <p>Stories are the main narrative surface of the universe. This paragraph belongs to the H2 section.</p>
  <h6 id="tiny-note">A tiny H6 note</h6>
  <p>The H6 line is shorter than the H2 line.</p>
  <h3 id="stories-written">The stories written in this universe</h3>
  <p>This paragraph is under an H3 and should be folded on the first render.</p>
  <ul>
    <li>Short stories
      <ul>
        <li>A first contact story</li>
        <li>A quiet story about a mapmaker</li>
      </ul>
    </li>
    <li>Novels</li>
  </ul>

  <h2 id="characters">Characters</h2>
  <p>Characters are the people who make the universe legible.</p>
  <h3 id="characters-base">The base version of characters in this universe</h3>
  <p>This content starts folded under the H3.</p>

  <h2 id="universe">Universe</h2>
  <p>The universe is the set of locations, rules, and habits that make the stories feel like they share a home.</p>

  <ul class="contains-task-list">
    <li class="task-list-item"><label><input type="checkbox" class="task-list-item-checkbox"> Finish the map</label>
      <ul>
        <li>Draw the northern coast</li>
        <li class="task-list-item"><label><input type="checkbox" class="task-list-item-checkbox"> Check the harbor</label></li>
      </ul>
    </li>
    <li class="task-list-item"><label><input type="checkbox" class="task-list-item-checkbox" checked> Write the index</label></li>
  </ul>

  <h3 id="universe-locations">The basic version of locations in this universe</h3>
  <p>This content starts folded under the H3.</p>

  <hr>
  <p class="harness-note">Harness only. The real plugin runs in MarkEdit and styles `.markdown-body[data-its-preview]`.</p>
</template>

<article class="markdown-body" id="pane"></article>

<script>
  const pane = document.getElementById('pane');
  const sample = document.getElementById('sample');

  function renderPane() {
    pane.replaceChildren(sample.content.cloneNode(true));
  }

  renderPane();

  const mockMarkEdit = {
    userSettings: {
      'extension.markeditThemeIts': {
        autoFold: true,
        autoFoldLevel: 3,
        listFolding: true,
        debug: false,
      },
    },
    onEditorReady(callback) {
      setTimeout(callback, 0);
    },
    getDirectoryPath() {
      return '/tmp';
    },
    async getFileInfo() {
      return { filePath: '/tmp/markedit-its-harness.md' };
    },
    async createFile() {
      return true;
    },
  };

  window.MarkEdit = mockMarkEdit;

  fetch('../src/its/markedit-theme-its-preview.js')
    .then((response) => response.text())
    .then((source) => {
      const run = new Function('MarkEdit', 'require', source);
      run(mockMarkEdit, () => ({}));
    })
    .catch((error) => console.error('Failed to load plugin', error));

  document.getElementById('rerender').addEventListener('click', renderPane);
  document.getElementById('expand-all').addEventListener('click', () => {
    pane.querySelectorAll('.its-heading-fold').forEach((button) => {
      const section = button.dataset.itsSection && document.getElementById(button.dataset.itsSection);
      if (section && section.hidden) {
        button.click();
      }
    });
  });
  document.getElementById('collapse-all').addEventListener('click', () => {
    pane.querySelectorAll('.its-heading-fold').forEach((button) => {
      const section = button.dataset.itsSection && document.getElementById(button.dataset.itsSection);
      if (section && !section.hidden) {
        button.click();
      }
    });
  });
  document.getElementById('expand-lists').addEventListener('click', () => {
    pane.querySelectorAll('.its-list-fold').forEach((button) => {
      if (button.getAttribute('aria-expanded') === 'false') {
        button.click();
      }
    });
  });
  document.getElementById('collapse-lists').addEventListener('click', () => {
    pane.querySelectorAll('.its-list-fold').forEach((button) => {
      if (button.getAttribute('aria-expanded') === 'true') {
        button.click();
      }
    });
  });
</script>
</body>
</html>

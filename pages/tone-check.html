<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Theme Pack — tone check</title>
<style>
  /* GitHub base CSS, as MarkEdit-preview loads it before the theme pack. */
  .markdown-body { font-family: -apple-system, "Segoe UI", sans-serif; padding: 24px; }
  .markdown-body pre { padding: 16px; overflow: auto; border-radius: 6px; background: #f6f8fa; }
  .markdown-body code { font-family: ui-monospace, Menlo, monospace; font-size: 0.92em; }
  .markdown-body table { border-collapse: collapse; }
  .markdown-body th, .markdown-body td { border: 1px solid #d0d7de; padding: 6px 13px; }
  .markdown-body thead { background: #f6f8fa; }
  .markdown-body h2 { border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; }

  /* highlight.js github-light — the palette that breaks dark previews. */
  .hljs { color: #24292e; background: #ffffff; }
  .hljs-comment, .hljs-quote { color: #6a737d; font-style: italic; }
  .hljs-keyword, .hljs-selector-tag { color: #d73a49; }
  .hljs-string, .hljs-addition { color: #032f62; }
  .hljs-number, .hljs-literal { color: #005cc5; }
  .hljs-title, .hljs-section { color: #6f42c1; }
  .hljs-attr, .hljs-attribute { color: #005cc5; }
  .hljs-built_in { color: #e36209; }

  body { margin: 0; background: #6b6b6b; }
  .grid { display: grid; grid-template-columns: repeat(2, 620px); gap: 18px; padding: 18px; }
  .caption { background: #ffd54d; color: #111; font: 600 13px/1.4 sans-serif; padding: 4px 8px; }
  .mermaid { margin: 12px 0; }
  .note { font: 13px/1.6 sans-serif; color: #fff; padding: 0 20px 14px; }

  /* ITS paints no surface of its own: pre/table colors come from the host.
     Emulate a dark host for the dark-tone ITS pane so the two ITS panels show
     what MarkEdit actually looks like in each appearance. */
  .markdown-body[data-preview-theme="its"][data-theme-pack-tone="dark"] pre,
  .markdown-body[data-preview-theme="its"][data-theme-pack-tone="dark"] thead {
    background: #161b22;
  }

  .markdown-body[data-preview-theme="its"][data-theme-pack-tone="dark"] :is(th, td) {
    border-color: #30363d;
  }

  /* mermaid 的调色板只看宿主深浅色（MarkEdit-preview 就是这么初始化的）。这里用
     #fx 作用域模拟它注入的 #mermaid-xxx 样式；主题包只在深色 tone 下用
     !important 覆盖，浅色主题永远保留下面这套原生颜色。 */
  body[data-fixture-host="light"] #fx .actor { fill: #ececff; stroke: #9370db; stroke-width: 1; }
  body[data-fixture-host="light"] #fx text.actor > tspan { fill: #333333; stroke: none; }
  body[data-fixture-host="light"] #fx .messageText { fill: #333333; }
  body[data-fixture-host="light"] #fx .noteText > tspan { fill: #333333; }
  body[data-fixture-host="light"] #fx .actor-line { stroke: #cccccc; }
  body[data-fixture-host="light"] #fx .messageLine0,
  body[data-fixture-host="light"] #fx .flowchart-link { stroke: #333333; }
  body[data-fixture-host="light"] #fx .messageLine1 { stroke: #333333; }
  body[data-fixture-host="light"] #fx .note { fill: #fff5ad; stroke: #decc93; }
  body[data-fixture-host="light"] #fx .node rect { fill: #ececff; stroke: #9370db; }
  body[data-fixture-host="light"] #fx .nodeLabel div { color: #333333; }
  body[data-fixture-host="light"] #fx .edgeLabelBackground { fill: #e8e8e8; }
  body[data-fixture-host="light"] #fx .marker { fill: #333333; stroke: #333333; }
  body[data-fixture-host="light"] #fx circle.sequenceNumber { fill: #333333; stroke: #000000; }
  body[data-fixture-host="light"] #fx text.sequenceNumber { fill: #ffffff; }

  body[data-fixture-host="dark"] #fx .actor { fill: #1f2020; stroke: #cccccc; stroke-width: 1; }
  body[data-fixture-host="dark"] #fx text.actor > tspan { fill: lightgrey; stroke: none; }
  body[data-fixture-host="dark"] #fx .messageText { fill: lightgrey; }
  body[data-fixture-host="dark"] #fx .noteText > tspan { fill: lightgrey; }
  body[data-fixture-host="dark"] #fx .actor-line { stroke: #cccccc; }
  body[data-fixture-host="dark"] #fx .messageLine0,
  body[data-fixture-host="dark"] #fx .messageLine1,
  body[data-fixture-host="dark"] #fx .flowchart-link { stroke: #cccccc; }
  body[data-fixture-host="dark"] #fx .note { fill: #474949; stroke: #2f2f2f; }
  body[data-fixture-host="dark"] #fx .node rect { fill: #1f2020; stroke: #cccccc; }
  body[data-fixture-host="dark"] #fx .nodeLabel div { color: lightgrey; }
  body[data-fixture-host="dark"] #fx .edgeLabelBackground { fill: #1f2020; }
  body[data-fixture-host="dark"] #fx .marker { fill: #cccccc; stroke: #cccccc; }
  body[data-fixture-host="dark"] #fx circle.sequenceNumber { fill: #cccccc; stroke: #ffffff; }
  body[data-fixture-host="dark"] #fx text.sequenceNumber { fill: #1f2020; }
</style>
</head>
<body data-fixture-host="light">
<p class="note">
  每个面板写死一个 <code>data-theme-pack-tone</code>，用来在没有 MarkEdit 的情况下检查 tone 驱动的代码块与 mermaid 配色。
  真实 mermaid 图由 MarkEdit-preview 渲染；这里的 SVG 只是按 mermaid v12 的类名手写的替身。
  用法：<code>python3 -m http.server</code> 后打开 <code>/pages/tone-check.html</code>。
  <label style="margin-left:12px"><input type="checkbox" id="host-toggle"> 宿主切到深色（mermaid 改用 dark 初始化：深色主题仍被主题包覆盖，浅色主题保留 mermaid 自己的颜色）</label>
</p>
<div class="grid" id="grid"></div>
<script>
const CODE = `<pre><code class="hljs language-python"><span class="hljs-comment"># 计算斐波那契数列</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">fib</span>(n: <span class="hljs-built_in">int</span>) -&gt; <span class="hljs-meta">str</span>:
    <span class="hljs-string">"返回第 n 项，注意这里是字符串"</span>
    memo = {<span class="hljs-number">0</span>: <span class="hljs-number">1</span>}
    <span class="hljs-keyword">if</span> n <span class="hljs-operator">in</span> memo:
        <span class="hljs-keyword">return</span> memo[n]
    <span class="hljs-keyword">return</span> <span class="hljs-string">f"fib(<span class="hljs-subst">{n}</span>)"</span> <span class="hljs-comment"># tail comment</span>

<span class="hljs-addition">+ added line</span>
<span class="hljs-deletion">- removed line</span></code></pre>`;

// 14 rows so the sticky header can actually be seen while scrolling.
const TABLE = `<table><thead><tr><th>字段</th><th>类型</th><th>说明</th></tr></thead><tbody>${
  Array.from({ length: 14 }, (_, index) => {
    const n = index + 1;
    return `<tr><td><code>column_${String(n).padStart(2, "0")}</code></td><td>${["int64", "string", "datetime", "json"][index % 4]}</td><td>第 ${n} 行：滚动时表头应停在面板顶部。</td></tr>`;
  }).join("")
}</tbody></table>`;

// mermaid v12 with its default "neo" look emits an id-scoped stylesheet inside
// the SVG (rect.actor + text.actor > tspan), so the fixture keeps its native
// colors out of the pack's reach and lets the pack override them with
// !important. The native palette is host-driven, hence identical for all panels.
const MERMAID = `<div class="mermaid"><svg id="fx" viewBox="0 0 460 210" width="460" height="210">
<g class="actors">
  <rect class="actor actor-box" data-look="neo" x="10" y="4" width="110" height="34" rx="3"/>
  <text class="actor actor-box" x="65" y="21" text-anchor="middle"><tspan x="65" dy="0">客户端</tspan></text>
  <rect class="actor actor-box" data-look="neo" x="330" y="4" width="110" height="34" rx="3"/>
  <text class="actor actor-box" x="385" y="21" text-anchor="middle"><tspan x="385" dy="0">服务端</tspan></text>
</g>
<line class="actor-line" x1="65" y1="38" x2="65" y2="200" stroke-width="1.5" stroke-dasharray="3,3"/>
<line class="actor-line" x1="385" y1="38" x2="385" y2="200" stroke-width="1.5" stroke-dasharray="3,3"/>
<g class="message0"><line class="messageLine0" x1="65" y1="80" x2="385" y2="80" stroke-width="2"/>
<text class="messageText" x="225" y="75" text-anchor="middle">POST /login</text>
<path class="marker arrowhead" d="M0,0 L9,4.5 L0,9 z"/></g>
<g class="message1"><line class="messageLine1" x1="385" y1="120" x2="65" y2="120" stroke-width="2" stroke-dasharray="3,3"/>
<text class="messageText" x="225" y="115" text-anchor="middle">token 已签发</text></g>
<g class="note"><rect class="note" data-look="neo" width="150" height="30" x="60" y="160"/>
<text class="noteText" x="135" y="180" text-anchor="middle"><tspan>便签文字</tspan></text></g>
<circle class="sequenceNumber" cx="20" cy="80" r="9"/>
<text class="sequenceNumber" x="20" y="84" text-anchor="middle">1</text>
<g class="flow"><g class="node"><rect class="basic" data-look="neo" width="120" height="40" x="320" y="155"/>
<foreignObject class="nodeLabel" x="320" y="155" width="120" height="40"><div xmlns="http://www.w3.org/1999/xhtml">流程节点</div></foreignObject></g>
<path class="flowchart-link" d="M320 175 L250 175" stroke-width="1.5"/>
<rect class="edgeLabelBackground" x="252" y="160" width="46" height="20"/>
<foreignObject class="edgeLabel" x="252" y="160" width="46" height="20"><div xmlns="http://www.w3.org/1999/xhtml" class="label"><span>条件</span></div></foreignObject></g>
</svg></div>`;

const PANES = [
  ["its", "light"],
  ["its", "dark"],
  ["maple-light", "light"],
  ["maple-dark", "dark"],
  ["obsidianite", "dark"],
  ["obsidianite-bracket", "dark"],
];

async function main() {
  const source = await (await fetch("../dist/markedit-theme-pack.js")).text();
  const start = source.indexOf("const CSS = `") + "const CSS = `".length;
  const css = source.slice(start, source.indexOf("`;", start));
  const style = document.createElement("style");
  style.textContent = css;
  document.head.append(style);

  const grid = document.getElementById("grid");
  for (const [theme, tone] of PANES) {
    const section = document.createElement("section");
    section.style.background = tone === "dark" ? "#101418" : "#ffffff";

    const caption = document.createElement("div");
    caption.className = "caption";
    caption.textContent = `${theme} · tone=${tone}`;

    const pane = document.createElement("article");
    pane.className = "markdown-body";
    pane.setAttribute("data-preview-theme", theme);
    pane.setAttribute("data-theme-pack-tone", tone);
    // Same switch the plugin writes from settings.stickyTableHeader, so the
    // long table below can be scrolled inside each panel.
    pane.setAttribute("data-theme-pack-table-sticky", "true");
    paintMermaid(pane, tone);
    pane.innerHTML = `<h2>标题 Heading</h2><p>正文文字，包含 <code>inline code</code> 与 <a href="#">链接</a>。</p>`
      + CODE + TABLE + MERMAID;

    section.append(caption, pane);
    grid.append(section);
  }

  document.title = "Theme Pack tone check — ready";
}

// Mirrors shouldPaintMermaid() in the plugin: only dark themes get the theme's
// own diagram palette. Light themes always keep mermaid's native colors, which
// is why the host switch below changes them but not the light panels.
function paintMermaid(pane, tone) {
  if (tone === "dark") {
    pane.setAttribute("data-theme-pack-mermaid-paint", "true");
  } else {
    pane.removeAttribute("data-theme-pack-mermaid-paint");
  }
}

function repaint() {
  document.querySelectorAll("#grid .markdown-body").forEach((pane) => {
    paintMermaid(pane, pane.getAttribute("data-theme-pack-tone"));
  });
}

document.addEventListener("click", (event) => {
  if (event.target?.id !== "host-toggle") {
    return;
  }
  document.body.dataset.fixtureHost = event.target.checked ? "dark" : "light";
  repaint();
});

main().catch((error) => {
  document.title = "tone check failed: " + error.message;
});
</script>
</body>
</html>
